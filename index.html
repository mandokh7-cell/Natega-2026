
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | منصة الثانوية - inneroom Space</title>
  
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- XLSX Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --bg-body: #F3F5F4;          
            --text-main: #111816;        
            --green-brand: #1A3C34;      
        }
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.6s ease-out forwards; }
        
        .input-field {
            width: 100%;
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            color: #111827;
            padding: 1rem 1.2rem;
            border-radius: 1rem;
            font-weight: bold;
            outline: none;
            transition: all 0.3s;
        }
        .input-field:focus {
            border-color: #4ADE80;
            box-shadow: 0 0 0 4px rgba(74, 222, 128, 0.1);
        }
    </style>
</head>
<body class="text-right">

    <!-- شريط التنقل للإدارة -->
    <nav class="bg-white border-b border-gray-200 fixed w-full z-50 top-0 shadow-sm">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-[#1A3C34] rounded-xl flex items-center justify-center text-white">
                    <i class="fas fa-cogs text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg md:text-xl font-black text-[#111816]">لوحة التحكم</h1>
                    <p class="text-xs text-[#4ADE80] font-bold">رفع النتائج</p>
                </div>
            </div>
            
            <button id="logout-btn" class="hidden bg-red-50 text-red-600 hover:bg-red-500 hover:text-white px-4 py-2 rounded-xl font-bold text-sm transition items-center gap-2 border border-red-100">
                <span>تسجيل الخروج</span> <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </nav>

    <main class="flex-grow pt-32 pb-16 px-4 flex justify-center items-center">
        
        <!-- نموذج تسجيل الدخول -->
        <div id="login-section" class="w-full max-w-md bg-white rounded-[32px] p-8 shadow-lg border border-gray-100 animate-fade-in text-center">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-[#1A3C34]/10 text-[#1A3C34] rounded-full mb-6">
                <i class="fas fa-user-shield text-4xl"></i>
            </div>
            <h2 class="text-3xl font-black text-[#1A3C34] mb-2">تسجيل الدخول</h2>
            <p class="text-gray-500 font-bold mb-8">الرجاء إدخال بيانات الإدارة للمتابعة.</p>
            
            <form id="login-form">
                <div class="mb-4 text-right">
                    <label class="block text-sm font-bold text-gray-700 mb-2">البريد الإلكتروني</label>
                    <input type="email" id="admin-email" required class="input-field" placeholder="admin@example.com" dir="ltr">
                </div>
                <div class="mb-6 text-right">
                    <label class="block text-sm font-bold text-gray-700 mb-2">كلمة المرور</label>
                    <input type="password" id="admin-pass" required class="input-field" placeholder="••••••••" dir="ltr">
                </div>
                
                <div id="login-error" class="hidden mb-4 text-sm font-bold text-red-500 bg-red-50 p-3 rounded-lg border border-red-100"></div>

                <button type="submit" id="login-btn" class="w-full bg-[#1A3C34] hover:bg-[#142E28] text-white font-black text-lg py-4 rounded-xl transition shadow-lg flex justify-center items-center gap-2">
                    <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
                </button>
            </form>
        </div>

        <!-- واجهة رفع الملفات (تظهر بعد الدخول) -->
        <div id="upload-section" class="hidden w-full max-w-2xl bg-white rounded-[32px] p-8 md:p-12 shadow-lg border border-gray-100 animate-fade-in">
            <h2 class="text-2xl font-black text-[#1A3C34] mb-2 border-r-4 border-[#4ADE80] pr-3">استيراد النتائج</h2>
            <p class="text-gray-600 font-bold mb-8">ارفع ملف Excel (.xlsx). سيتم اعتماد العمود الأول كرقم جلوس.</p>
            
            <div class="border-3 border-dashed border-gray-300 rounded-2xl p-10 text-center hover:bg-gray-50 transition cursor-pointer relative mb-6" id="drop-zone">
                <input type="file" id="excel-file" accept=".xlsx, .xls" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                <i class="fas fa-file-excel text-5xl text-[#1A3C34] mb-4"></i>
                <h4 class="text-lg font-bold text-gray-700 mb-2">اضغط هنا لاختيار الملف</h4>
                <p class="text-sm text-gray-500">سوف يتم رفع البيانات بشكل دفعات</p>
            </div>

            <div id="upload-status" class="hidden mb-6">
                <div class="flex justify-between text-sm font-bold text-[#1A3C34] mb-2">
                    <span id="progress-text">جاري التحضير...</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
                    <div id="progress-bar" class="bg-gradient-to-r from-[#1A3C34] to-[#4ADE80] h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>

            <div id="upload-result" class="hidden p-4 rounded-xl text-center font-bold mb-4"></div>

            <button id="start-upload-btn" disabled class="w-full bg-gray-300 text-gray-500 cursor-not-allowed font-black text-lg py-4 rounded-xl transition flex justify-center items-center gap-2">
                <i class="fas fa-cloud-upload-alt"></i> ابدأ رفع البيانات
            </button>
        </div>

    </main>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyCpJScin3sy9ehUner-W1lqB43WDY9PIYs",
            authDomain: "natega-f7a36.firebaseapp.com",
            projectId: "natega-f7a36",
            storageBucket: "natega-f7a36.firebasestorage.app",
            messagingSenderId: "450960885356",
            appId: "1:450960885356:web:6547036595aa72e7737a49"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const RESULTS_COLLECTION = "highschool_results";

        // عناصر واجهة المستخدم
        const loginSection = document.getElementById('login-section');
        const uploadSection = document.getElementById('upload-section');
        const logoutBtn = document.getElementById('logout-btn');
        
        const loginForm = document.getElementById('login-form');
        const loginBtn = document.getElementById('login-btn');
        const loginError = document.getElementById('login-error');

        // مراقبة حالة تسجيل الدخول
        onAuthStateChanged(auth, (user) => {
            if (user && !user.isAnonymous) {
                // مستخدم مسجل الدخول (المدير)
                loginSection.classList.add('hidden');
                uploadSection.classList.remove('hidden');
                logoutBtn.classList.remove('hidden');
                logoutBtn.classList.add('flex');
            } else {
                // غير مسجل
                loginSection.classList.remove('hidden');
                uploadSection.classList.add('hidden');
                logoutBtn.classList.add('hidden');
                logoutBtn.classList.remove('flex');
            }
        });

        // تسجيل الدخول
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('admin-email').value.trim();
            const pass = document.getElementById('admin-pass').value;
            
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحقق...';
            loginError.classList.add('hidden');

            try {
                await signInWithEmailAndPassword(auth, email, pass);
                // سيتم توجيهه للوحة عن طريق onAuthStateChanged
            } catch (error) {
                loginError.innerText = "فشل تسجيل الدخول: تأكد من صحة البريد الإلكتروني وكلمة المرور.";
                loginError.classList.remove('hidden');
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
            }
        });

        // تسجيل الخروج
        logoutBtn.addEventListener('click', async () => {
            await signOut(auth);
            // إعادة ضبط نموذج الرفع
            excelData = [];
            document.getElementById('excel-file').value = "";
            document.getElementById('upload-result').classList.add('hidden');
            document.getElementById('upload-status').classList.add('hidden');
            document.getElementById('start-upload-btn').disabled = true;
            document.getElementById('start-upload-btn').className = "w-full bg-gray-300 text-gray-500 cursor-not-allowed font-black text-lg py-4 rounded-xl transition flex justify-center items-center gap-2";
        });

        // --- كود قراءة ورفع الإكسيل ---
        let excelData = [];
        const fileInput = document.getElementById('excel-file');
        const startUploadBtn = document.getElementById('start-upload-btn');
        const uploadStatus = document.getElementById('upload-status');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const progressPercent = document.getElementById('progress-percent');
        const uploadResult = document.getElementById('upload-result');

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            uploadResult.classList.add('hidden');
            uploadStatus.classList.add('hidden');
            startUploadBtn.disabled = true;
            startUploadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري قراءة الملف...';

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                excelData = XLSX.utils.sheet_to_json(worksheet, { defval: null });
                
                if (excelData.length > 0) {
                    startUploadBtn.disabled = false;
                    startUploadBtn.className = "w-full bg-[#1A3C34] hover:bg-[#142E28] text-white font-black text-lg py-4 rounded-xl mt-4 transition shadow-lg flex justify-center items-center gap-2";
                    startUploadBtn.innerHTML = `<i class="fas fa-cloud-upload-alt"></i> ابدأ رفع (${excelData.length} سجل)`;
                } else {
                    startUploadBtn.innerHTML = 'الملف فارغ!';
                }
            };
            reader.readAsArrayBuffer(file);
        });

        startUploadBtn.addEventListener('click', async () => {
            if (excelData.length === 0) return;

            startUploadBtn.disabled = true;
            startUploadBtn.classList.add('opacity-50', 'cursor-wait');
            uploadStatus.classList.remove('hidden');
            uploadResult.classList.add('hidden');

            const totalRecords = excelData.length;
            const batchSize = 450; 
            let processed = 0;

            try {
                for (let i = 0; i < totalRecords; i += batchSize) {
                    const chunk = excelData.slice(i, i + batchSize);
                    const batch = writeBatch(db);

                    chunk.forEach(row => {
                        const keys = Object.keys(row);
                        if (keys.length === 0) return;
                        
                        const idKey = keys[0]; 
                        const docId = row[idKey] ? row[idKey].toString().trim() : null;
                        
                        if (docId) {
                            const cleanData = {};
                            for (const [k, v] of Object.entries(row)) {
                                if (v !== null && v !== undefined && v.toString().trim() !== '') {
                                    cleanData[k] = v;
                                }
                            }
                            
                            // حفظ البيانات في المجموعة مباشرة (بدون بيئة التطوير الوهمية)
                            const ref = doc(db, RESULTS_COLLECTION, docId);
                            batch.set(ref, cleanData);
                        }
                    });

                    await batch.commit();
                    
                    processed += chunk.length;
                    const percent = Math.min(100, Math.round((processed / totalRecords) * 100));
                    
                    progressBar.style.width = percent + '%';
                    progressPercent.innerText = percent + '%';
                    progressText.innerText = `تم رفع ${processed} من ${totalRecords}`;
                }

                uploadResult.className = "p-4 rounded-xl text-center font-bold mt-4 bg-green-50 text-green-700 border border-green-200 block animate-fade-in";
                uploadResult.innerHTML = `<i class="fas fa-check-circle text-2xl mb-2 block"></i> تمت عملية الرفع بنجاح! إجمالي السجلات: ${processed}`;

            } catch (error) {
                console.error("Batch write error:", error);
                uploadResult.className = "p-4 rounded-xl text-center font-bold mt-4 bg-red-50 text-red-700 border border-red-200 block animate-fade-in";
                uploadResult.innerHTML = `<i class="fas fa-times-circle text-2xl mb-2 block"></i> حدث خطأ، تأكد من صلاحيات قاعدة البيانات (Firestore Rules).`;
            } finally {
                startUploadBtn.classList.remove('opacity-50', 'cursor-wait');
                startUploadBtn.innerHTML = '<i class="fas fa-check"></i> اكتملت العملية';
            }
        });
    </script>
</body>
</html>
